    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">STアプリ</p>
          <h1>メニュー</h1>
        </div>
        <div class="status-area" aria-live="polite">
          <span id="app-version" class="status-pill">v1.0.8</span>

          <button id="update-app-button" type="button" class="secondary-action">最新版を確認</button>

      <main class="app-menu" aria-label="アプリ一覧">
        <a class="app-card app-card--attention" href="./st-attention-training-v0.1/index.html">
          <span class="app-card__tag">訓練</span>

          <span class="app-card__tag">評価入力</span>

          <span>CAT-Rの結果入力、計算補助、前回比較、記録管理を行います。</span>
        </a>
      </main>
    </div>

    <script src="./version.js?v=st-suite-guidance-20260930-1"></script>
